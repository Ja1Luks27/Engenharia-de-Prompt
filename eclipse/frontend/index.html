<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eclipse</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .wrap {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    /* header */
    .header {
      background: #201150;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: #dbeafe;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .header-name { font-size: 15px; font-weight: 600; color: #f4eded; }
    .header-sub  { font-size: 12px; color: #eff4fdee; }
    .online-dot  { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-left: auto; }

    /* feed */
    .feed {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f9fafb;
    }

    /* bolhas */
    .row { display: flex; gap: 8px; align-items: flex-end; }
    .row.user { flex-direction: row-reverse; }

    .av {
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600;
      flex-shrink: 0;
    }
    .av.ai   { background: #dbeafe; color: #1d4ed8; }
    .av.user { background: #e5e7eb; color: #374151; }

    .col { display: flex; flex-direction: column; max-width: 75%; }

    .bub {
      padding: 9px 13px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
    }
    .bub.ai   {
      background: #fff;
      border: 1px solid #e5e7eb;
      color: #0d0d0d;
      border-bottom-left-radius: 4px;
    }
    .bub.user {
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bub code {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      background: rgba(0,0,0,0.07);
      padding: 1px 5px;
      border-radius: 4px;
    }
    .bub pre {
      background: #f3f4f6;
      border-radius: 8px;
      padding: 10px 12px;
      margin: 6px 0;
      overflow-x: auto;
    }
    .bub pre code { background: none; padding: 0; font-size: 12px; color: #166534; }
    .bub.user code { background: rgb(0, 0, 0); }

    .ts { font-size: 10px; color: #9ca3af; margin-top: 3px; padding: 0 4px; }
    .row.user .ts { text-align: right; }

    /* digitando */
    .typing { display: flex; gap: 4px; padding: 6px 4px; align-items: center; }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%;
      background: #9ca3af;
      animation: blink 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }

    /* chips */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 16px; background: #f9fafb; }
    .chip {
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 14px;
      border: 1px solid #d1d5db;
      background: #fff;
      color: #374151;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .chip:hover { background: #eff6ff; border-color: #93c5fd; color: #1d4ed8; }

    /* input */
    .input-area {
      border-top: 1px solid #e5e7eb;
      padding: 10px 12px;
      background: #fff;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .msg-input {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 22px;
      padding: 9px 16px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      background: #f9fafb;
      color: #111;
      transition: border-color 0.15s;
    }
    .msg-input:focus { border-color: #2563eb; background: #fff; }
    .msg-input::placeholder { color: #9ca3af; }
    .send-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: #2563eb;
      border: none;
      cursor: pointer;
      color: #fff;
      font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    .send-btn:hover  { background: #1d4ed8; }
    .send-btn:active { transform: scale(0.92); }
    .send-btn:disabled { background: #93c5fd; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="wrap">

  <!-- cabeçalho -->
  <div class="header">
    <div class="header-avatar">🤖</div>
    <div>
      <div class="header-name">Eclipse</div>
      <div class="header-sub">assistente de TI</div>
    </div>
    <div class="online-dot"></div>
  </div>

  <!-- mensagens -->
  <div class="feed" id="feed">
    <div class="row ai">
      <div class="av ai">E</div>
      <div class="col">
        <div class="bub ai">Oi! 👋 Sou o Eclipse, seu professor de TI. Pode perguntar qualquer coisa!</div>
        <div class="ts">agora</div>
      </div>
    </div>
  </div>

  <!-- sugestões rápidas -->
  <div class="chips" id="chips">
    <span class="chip" onclick="usarChip(this)">O que é um loop for?</span>
    <span class="chip" onclick="usarChip(this)">Como funciona o TCP/IP?</span>
    <span class="chip" onclick="usarChip(this)">O que é variável?</span>
    <span class="chip" onclick="usarChip(this)">SQL x NoSQL</span>
  </div>

  <!-- input -->
  <div class="input-area">
    <input type="text" id="msg-input" class="msg-input" placeholder="Digite sua dúvida..."/>
    <button id="send-btn" class="send-btn" title="Enviar">&#9658;</button>
  </div>

</div>

<script>
  var historico = [];

  var SYSTEM = `
    Você é o Eclipse, um chatbot criado para ensinar alunos de todas as idades sobre TI.
    Assuma o papel de um professor de TI com boa didática.
    Fale em português Brasil de forma descontraída.
    Explique de forma clara, use exemplos e analogias do dia a dia.
    Faça 3 perguntas curtas ao final para fixação.
    Sugira o próximo passo de estudo.
    Use markdown simples (crases para código).
    Seja objetivo — evite respostas longas demais.
  `.trim();

  function hora() {
    var d = new Date();
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }

  function escHtml(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderMd(txt) {
    txt = txt.replace(/```[\w]*\n?([\s\S]*?)```/g, function(_,c){
      return '<pre><code>' + escHtml(c.trim()) + '</code></pre>';
    });
    txt = txt.replace(/`([^`]+)`/g, '<code>$1</code>');
    txt = txt.replace(/\n/g, '<br>');
    return txt;
  }

  function addMsg(role, txt) {
    var feed = document.getElementById('feed');
    var isUser = role === 'user';

    var row = document.createElement('div');
    row.className = 'row ' + (isUser ? 'user' : 'ai');

    var av = document.createElement('div');
    av.className = 'av ' + (isUser ? 'user' : 'ai');
    av.textContent = isUser ? 'vc' : 'E';

    var col = document.createElement('div');
    col.className = 'col';

    var bub = document.createElement('div');
    bub.className = 'bub ' + (isUser ? 'user' : 'ai');
    bub.innerHTML = isUser ? escHtml(txt) : renderMd(txt);

    var ts = document.createElement('div');
    ts.className = 'ts';
    ts.textContent = hora();

    col.appendChild(bub);
    col.appendChild(ts);

    if (isUser) { row.appendChild(col); row.appendChild(av); }
    else        { row.appendChild(av); row.appendChild(col); }

    feed.appendChild(row);
    feed.scrollTop = feed.scrollHeight;
  }

  function showTyping() {
    var feed = document.getElementById('feed');
    var row = document.createElement('div');
    row.className = 'row ai'; row.id = 'typing';
    var av = document.createElement('div');
    av.className = 'av ai'; av.textContent = 'E';
    var col = document.createElement('div'); col.className = 'col';
    var bub = document.createElement('div'); bub.className = 'bub ai';
    bub.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    col.appendChild(bub); row.appendChild(av); row.appendChild(col);
    feed.appendChild(row);
    feed.scrollTop = feed.scrollHeight;
  }

  function removeTyping() {
    var t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function enviar(txt) {
    txt = txt.trim();
    if (!txt) return;

    document.getElementById('msg-input').value = '';
    document.getElementById('send-btn').disabled = true;
    document.getElementById('chips').style.display = 'none';

    addMsg('user', txt);
    showTyping();

    try {
      var res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ historico: historico, mensagem: txt, system: SYSTEM })
      });

      if (!res.ok) throw new Error('HTTP ' + res.status);

      var dados = await res.json();
      var resposta = dados.resposta || '(sem resposta)';

      removeTyping();
      addMsg('assistant', resposta);
      historico.push({ role: 'assistant', content: resposta });

    } catch (e) {
      removeTyping();
      addMsg('assistant', '⚠️ Não consegui conectar ao servidor.\n\nRode o `main.py` e tente de novo!\n\n`' + e.message + '`');
    }

    document.getElementById('send-btn').disabled = false;
    document.getElementById('msg-input').focus();
  }

  function usarChip(el) {
    enviar(el.textContent);
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('send-btn').addEventListener('click', function () {
      enviar(document.getElementById('msg-input').value);
    });

    document.getElementById('msg-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        enviar(this.value);
      }
    });
  });
</script>

</body>
</html>
